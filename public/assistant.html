<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Assistant</title>
  <style>
    :root { --bg: #faf9f5; --fg: #1f1e1d; --muted: #6b6a66; --accent: #d97757; --card: #ffffff; --border: #e5e3dc; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1f1e1d; --fg: #f0eee6; --muted: #a3a19a; --card: #2a2927; --border: #3a3936; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif;
           min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p.hint { color: var(--muted); margin: 0 0 24px; text-align: center; }
    #mic { width: 120px; height: 120px; border-radius: 50%; border: none; background: var(--accent); color: #fff;
           font-size: 3rem; cursor: pointer; transition: transform .15s, box-shadow .15s; }
    #mic.listening { transform: scale(1.08); box-shadow: 0 0 0 12px color-mix(in srgb, var(--accent) 30%, transparent); }
    #mic:disabled { opacity: .5; cursor: wait; }
    #status { color: var(--muted); margin: 16px 0; min-height: 1.5em; }
    form { display: flex; gap: 8px; width: 100%; max-width: 560px; }
    input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--fg); font: inherit; }
    button.small { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--fg); font: inherit; cursor: pointer; }
    #log { width: 100%; max-width: 560px; margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); }
    .msg.you { align-self: flex-end; background: var(--accent); color: #fff; border-color: transparent; }
  </style>
</head>
<body>
  <h1>Claude Assistant</h1>
  <p class="hint">Tap the mic and talk, or type below. Claude answers out loud.</p>

  <button id="mic" aria-label="Talk to Claude">🎤</button>
  <div id="status"></div>

  <form id="typeForm">
    <input id="typed" placeholder="Or type a question…" autocomplete="off">
    <button class="small" type="submit">Ask</button>
    <button class="small" type="button" id="reset">New chat</button>
  </form>

  <div id="log"></div>

  <script>
    let mic = document.getElementById("mic");
    let statusEl = document.getElementById("status");
    let log = document.getElementById("log");

    // if the server was started with ASSISTANT_TOKEN, open this page as /?token=yourtoken
    let token = new URLSearchParams(location.search).get("token") || "";

    function addMessage(text, who) {
      let div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      log.prepend(div);
    }

    function speak(text) {
      speechSynthesis.cancel();
      speechSynthesis.speak(new SpeechSynthesisUtterance(text));
    }

    async function post(url, body) {
      let res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Assistant-Token": token },
        body: JSON.stringify(body || {})
      });
      let data = await res.json();
      return data.reply || data.error || "No reply.";
    }

    async function ask(text) {
      addMessage(text, "you");
      statusEl.textContent = "Thinking…";
      mic.disabled = true;
      try {
        let reply = await post("/ask", { text: text });
        addMessage(reply, "claude");
        speak(reply);
        statusEl.textContent = "";
      } catch (err) {
        statusEl.textContent = "Couldn't reach the server.";
      }
      mic.disabled = false;
    }

    // speech recognition (Chrome, Edge, Safari)
    let Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (Recognition) {
      let recognizer = new Recognition();
      recognizer.lang = "en-US";
      recognizer.interimResults = false;

      recognizer.onstart = function() { mic.classList.add("listening"); statusEl.textContent = "Listening…"; };
      recognizer.onend = function() { mic.classList.remove("listening"); if (statusEl.textContent === "Listening…") statusEl.textContent = ""; };
      recognizer.onerror = function(e) { statusEl.textContent = "Mic error: " + e.error; };
      recognizer.onresult = function(e) { ask(e.results[0][0].transcript); };

      mic.addEventListener("click", function() {
        speechSynthesis.cancel();
        recognizer.start();
      });
    } else {
      mic.disabled = true;
      statusEl.textContent = "This browser can't do speech recognition. Type instead.";
    }

    document.getElementById("typeForm").addEventListener("submit", function(e) {
      e.preventDefault();
      let input = document.getElementById("typed");
      if (input.value.trim()) ask(input.value.trim());
      input.value = "";
    });

    document.getElementById("reset").addEventListener("click", async function() {
      log.innerHTML = "";
      statusEl.textContent = await post("/reset");
    });
  </script>
</body>
</html>
